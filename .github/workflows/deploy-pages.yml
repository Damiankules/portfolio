name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Vantage/package-lock.json

      - name: Install Vantage dependencies
        working-directory: Vantage
        run: npm ci

      - name: Build Vantage (static, for /vantage/)
        working-directory: Vantage
        run: npm run build:pages

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          # Existing static pages stay at the site root, unchanged.
          shopt -s nullglob
          for f in index.html asme-landing.html coffee-menu.html meridian-landing.html; do
            [ -f "$f" ] && cp "$f" _site/
          done
          [ -d images ] && cp -r images _site/
          [ -d raudones ] && cp -r raudones _site/
          # Vantage lives under /vantage/.
          mkdir -p _site/vantage
          cp -r Vantage/dist-pages/. _site/vantage/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
