<!DOCTYPE html>
<html lang="lt">
<head><meta charset="utf-8"><title>Užklausos forma</title><meta name="robots" content="noindex"></head>
<body>
<!--
  Netlify Forms blueprint. Netlify scans this static file at deploy time and
  registers the "uzklausa" form with these fields. The React ContactForm
  posts to this URL. Keep field names in sync with src/components/ui/ContactForm.tsx.
-->
<form name="uzklausa" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="uzklausa">
  <input type="text" name="tema">
  <input type="text" name="bot-field">
  <input type="text" name="vardas">
  <input type="tel" name="telefonas">
  <input type="email" name="email">
  <textarea name="aprasymas"></textarea>
  <input type="file" name="failas">
</form>
</body>
</html>
